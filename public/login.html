<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In — akFISHinfo</title>
  <meta name="theme-color" content="#060a0f" data-dynamic>
  <script src="/static/platform.js"></script>
  <script src="/static/sentry-bootstrap.js" defer></script>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme.css"/>
  <link rel="stylesheet" href="/static/platform.css"/>
  <style>
    @font-face {
      font-family: 'Blackbird';
      src: url('/static/projekt-blackbird-v2.otf') format('opentype');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wordmark {
      font-family: 'Blackbird', sans-serif;
      font-size: 22px;
      letter-spacing: 0.03em;
      color: var(--text);
      margin-bottom: 28px;
      user-select: none;
      text-decoration: none;
      display: block;
    }
    .wordmark em { font-style: normal; color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 28px 26px;
      width: 100%;
      max-width: 380px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 22px;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      color: #3c4043;
      border: none;
      border-radius: 0;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-google:hover { opacity: 0.9; }
    .btn-apple {
      display: none;  /* shown only on native iOS via JS */
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .btn-apple:hover { opacity: 0.88; }
    .btn-apple:disabled { opacity: 0.55; cursor: progress; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--border);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    input {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 12px;
      cursor: pointer;
    }
    input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 0;
      color: #000;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .toggle-row {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    .toggle-row a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 4px;
    }
    .toggle-row a:hover { text-decoration: underline; }
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
      border-radius: 0;
      padding: 9px 12px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      display: none;
    }
    .back {
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: var(--text); }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; top: -40px; left: 8px;
      background: var(--accent); color: #000;
      padding: 6px 12px; border-radius: 0;
      font-size: 12px; font-weight: 700; text-decoration: none;
      z-index: 9999; transition: top 0.15s;
    }
    .skip-link:focus { top: 0; }
    main { display: contents; }
  </style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode" style="position:fixed;top:14px;right:14px;z-index:100"><span class="icon-sun" aria-hidden="true">☀</span><span class="icon-moon" aria-hidden="true">☾</span></button>
  <a href="#main" class="skip-link">Skip to content</a>

  <a href="/" class="wordmark">akFISH<em>info.</em></a>

  <main id="main">
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Real time alerts for PWS.</p>

    <div class="error-msg" id="errorMsg">Sign-in failed. Please try again.</div>

    <!-- Sign in with Apple — shown only on native iOS shells. Required by
         App Store guideline 4.8 since we also offer Google. Placed above
         Google to satisfy the HIG "at least as prominent" rule. -->
    <button type="button" class="btn-apple" id="appleSignInBtn" aria-label="Sign in with Apple">
      <svg width="16" height="16" viewBox="0 0 384 512" aria-hidden="true">
        <path fill="#fff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      Sign in with Apple
    </button>

    <a href="/auth/google" class="btn-google" aria-label="Sign in with Google">
      <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider">or</div>

    <form id="signin-form">
      <label for="si-email" class="sr-only">Email address</label>
      <input type="email"    id="si-email"    placeholder="Email"    required autocomplete="email" />
      <label for="si-password" class="sr-only">Password</label>
      <input type="password" id="si-password" placeholder="Password" required autocomplete="current-password" />
      <label class="remember-row">
        <input type="checkbox" id="si-remember" /> Stay signed in for 30 days
      </label>
      <button type="submit" class="btn-submit">Sign in</button>
    </form>

    <div class="toggle-row web-only">
      Don't have an account?<a href="/signup">Sign up</a>
    </div>
    <!-- Native: per App Store 3.1.3(f) we don't show signup CTAs.
         Users sign up at akfishinfo.com on the web and then download. -->
    <div class="toggle-row native-only">
      New here? Visit akfishinfo.com to get started.
    </div>
  </div>
  </main>

  <a href="/" class="back">Back to homepage</a>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('errorMsg').style.display = 'block';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function doSignIn(e) {
      e.preventDefault();
      const email       = document.getElementById('si-email').value.trim();
      const password    = document.getElementById('si-password').value;
      const remember_me = document.getElementById('si-remember').checked;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember_me }),
        });
        const d = await r.json();
        if (!r.ok) { showError(d.error || 'Sign-in failed.'); return; }
        akfiNav(d.redirect);
      } catch { showError('Connection error. Please try again.'); }
    }

    document.getElementById('signin-form').addEventListener('submit', doSignIn);

    // ── Sign in with Apple (native iOS only) ──────────────────────────
    // Plugin: @capacitor-community/apple-sign-in. The native bridge exposes
    // it at window.Capacitor.Plugins.SignInWithApple whenever the shell was
    // built with the plugin installed. Hide the button if not present.
    (function wireApple() {
      const btn = document.getElementById('appleSignInBtn');
      if (!btn) return;
      const Cap = window.Capacitor;
      const SignInWithApple = Cap && Cap.Plugins && Cap.Plugins.SignInWithApple;
      const isiOS = Cap && typeof Cap.getPlatform === 'function' && Cap.getPlatform() === 'ios';
      if (!SignInWithApple || !isiOS) return;
      btn.style.display = 'flex';

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          // Random nonce → SHA-256 hash is what Apple echoes in the `nonce`
          // claim of the identity token. We send the *raw* nonce to the server
          // so it can re-hash and compare.
          const rawNonce = (crypto && crypto.randomUUID)
            ? crypto.randomUUID() + crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(36).slice(2);

          const result = await SignInWithApple.authorize({
            clientId: 'info.akfish.app',           // bundle ID on native iOS
            redirectURI: 'https://akfishinfo.com/auth/apple/callback',
            scopes: 'email name',
            state: rawNonce.slice(0, 16),
            nonce: rawNonce,
          });

          const r = result && result.response;
          if (!r || !r.identityToken) {
            showError('Apple did not return an identity token.');
            return;
          }

          const resp = await fetch('/api/auth/apple/native', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              identityToken: r.identityToken,
              authorizationCode: r.authorizationCode || null,
              user: r.user || null,
              email: r.email || null,                  // null on subsequent sign-ins
              fullName: r.givenName || r.familyName
                ? { givenName: r.givenName || null, familyName: r.familyName || null }
                : null,
              nonce: rawNonce,
            }),
          });
          const d = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            showError(d.error || 'Apple sign-in failed.');
            return;
          }
          // Save the bearer for cross-origin auth — WKWebView won't
          // replay session cookies across capacitor://localhost →
          // akfishinfo.com, so platform.js sends this on every native
          // request as `Authorization: Bearer <jwt>`.
          if (d.bearer) {
            try { localStorage.setItem('akfi.bearer', d.bearer); } catch (_) {}
          }
          akfiNav(d.redirect || '/app');
        } catch (err) {
          // The plugin rejects with code 1001 when the user cancels — don't
          // show an error for that, just re-enable the button.
          const cancelled = err && (err.code === '1001' || err.code === 1001 ||
            /cancel/i.test(err.message || ''));
          if (!cancelled) {
            // Capacitor's bridge serializes Error objects without `.message`
            // by default, so the xcode log just shows the stack. Log the
            // pieces explicitly so we can actually diagnose failures.
            console.error('SIWA error:',
              (err && (err.message || err.name)) || String(err),
              err);
            showError(((err && err.message) || 'Apple sign-in failed.') + ' Try again.');
          }
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
